$kind: http-request
name: TC_AUTH_007 Login with incorrect password -> 401 Unauthorized
url: "{{userServiceUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "tan.tranminh@dedocu.vn",
      "password": "WrongPassword999"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Returns credentials error', function () {
          const res = pm.response.json();
          pm.expect(res.message).to.include('không chính xác');
      });
    language: text/javascript
order: 7000
