$kind: http-request
name: TC_AUTH_005 Register validation failure (short password) -> 400 Bad Request
url: "{{userServiceUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "valid_email@dedocu.vn",
      "username": "validuser",
      "password": "123",
      "fullName": "Nguyen Van A"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400 Bad Request', function () {
          pm.response.to.have.status(400);
      });

      pm.test('Validation message returned', function () {
          const res = pm.response.json();
          pm.expect(res.message).to.include('Mật khẩu phải từ 6 ký tự trở lên');
      });
    language: text/javascript
order: 5000
