$kind: http-request
name: TC_AUTH_003 Verify OTP failed with incorrect code -> 401 Unauthorized
url: "{{userServiceUrl}}/api/v1/auth/verify-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "tan.tranminh@dedocu.vn",
      "code": "999999"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });

      pm.test('Error message notifies invalid OTP', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.false;
          pm.expect(res.message).to.include('không chính xác');
      });
    language: text/javascript
order: 3000
