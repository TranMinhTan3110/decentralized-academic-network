$kind: http-request
name: TC_DOC_020_Notifications - GET /api/v1/notifications - Danh sách thông báo người dùng
url: "{{documentServiceUrl}}/api/v1/notifications"
method: GET
headers:
  X-User-Id: "{{testUserId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      var res = pm.response.json();
      if (res.data && res.data.length > 0) { pm.environment.set("notificationId", res.data[0].id); }
    language: text/javascript
order: 1000
