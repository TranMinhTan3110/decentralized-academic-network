$kind: http-request
name: TC_DOC_023_Report - POST /api/v1/documents/:id/report - Báo cáo vi phạm tài liệu
url: "{{documentServiceUrl}}/api/v1/documents/{{docId}}/report"
method: POST
headers:
  X-User-Id: "{{testUserId}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "reason": "Bản quyền nội dung trái phép",
      "description": "Tài liệu vi phạm chính sách chia sẻ"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });
    language: text/javascript
order: 4000
