$kind: http-request
name: TC_DOC_013_Delete_Comment - DELETE /api/v1/documents/comments/:commentId - Xóa bình luận cá nhân
url: "{{documentServiceUrl}}/api/v1/documents/comments/{{commentId}}"
method: DELETE
headers:
  X-User-Id: "{{testUserId}}"
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.variables.get("commentId") || pm.variables.get("commentId") === "") {
          pm.variables.set("commentId", "00000000-0000-0000-0000-000000000000");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 200, 403 or 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 403, 404]);
      });
    language: text/javascript
order: 5000
