$kind: http-request
name: TC_DOC_001_Feed - GET /api/v1/documents - Feed khám phá tài liệu
url: "{{documentServiceUrl}}/api/v1/documents?page=0&size=10"
method: GET
queryParams:
  page: "0"
  size: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      var res = pm.response.json();
      if (res.data && res.data.content && res.data.content.length > 0) {
          pm.environment.set("docId", res.data.content[0].id);
      }
    language: text/javascript
order: 1000
