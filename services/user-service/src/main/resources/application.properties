# ==============================================================================
# USER SERVICE CONFIGURATION (PORT 8081)
# ==============================================================================
spring.application.name=user-service
server.port=8081

# Ket noi CSDL doc lap: user_db tren Docker PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate: Code-First dung validate de dam bao Entity khop voi Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Google OAuth2 Authentication (doc tu bien moi truong GOOGLE_CLIENT_ID hoac .env)
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]
google.client-id=${GOOGLE_CLIENT_ID:mock-google-client-id}

