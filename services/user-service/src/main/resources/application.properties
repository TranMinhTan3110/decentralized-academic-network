# ==============================================================================
# USER SERVICE CONFIGURATION (PORT 8081)
# ==============================================================================
spring.application.name=user-service
server.port=8081

# Ket noi CSDL doc lap: user_db tren Docker PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate: Code-First dung validate de dam bao Entity khop voi Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Google OAuth2 Authentication (doc tu bien moi truong GOOGLE_CLIENT_ID hoac .env)
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]
google.client-id=${GOOGLE_CLIENT_ID:mock-google-client-id}

# Email Service Configuration (JavaMailSender / SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================== Internal service-to-service API =====================
# Khóa dùng chung cho document-service gọi deduct-points/balance.
# Để trống ở môi trường dev; đặt qua biến môi trường khi deploy.
internal.api.key=${INTERNAL_API_KEY:}

