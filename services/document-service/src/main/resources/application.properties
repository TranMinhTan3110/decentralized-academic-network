# ==============================================================================
# DOCUMENT SERVICE CONFIGURATION (PORT 8082)
# ==============================================================================
spring.application.name=document-service
server.port=8082

# File upload multipart configuration (PDF support up to 200MB)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Ket noi CSDL doc lap: document_db tren Docker PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/document_db
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.topics.document-events=document-events

# User Service endpoint
services.user-service.url=http://localhost:8081

# JWT Secret Key (matching user-service for direct token decoding)
# JWT secret: đặt biến môi trường JWT_SECRET khi deploy (phải trùng user-service & gateway)
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Tin X-User-Id header từ client (chế độ dev không qua gateway). Production: TRUST_X_USER_ID=false
application.security.trust-x-user-id=${TRUST_X_USER_ID:true}

# ==============================================================================
  # HYBRID IPFS CONFIGURATION                                                               
  # ==============================================================================
  # ipfs.mode quy định cơ chế lưu trữ và pin tệp lên mạng lưới IPFS.
  # Các giá trị hợp lệ:
  # 1. "mock"        : Chế độ giả lập (mặc định dùng cho local development & test).
  #                    - Tự sinh mã CID ngẫu nhiên (định dạng "Qm...MockCID").
  #                    - Hoạt động offline hoàn toàn, không cần chạy IPFS node hay tài khoản Pinata.  
  # 2. "local-only"  : Chỉ upload và pin tệp lên IPFS Kubo node cục bộ qua RPC API.
  #                    - Sử dụng cấu hình ipfs.local.api-url và ipfs.local.gateway-url.
  #                    - Không upload lên Pinata Cloud.
  # 3. "pinata-only" : Chỉ upload và pin tệp lên dịch vụ đám mây Pinata Cloud.
  #                    - Yêu cầu cấu hình JWT Bearer Token tại ipfs.pinata.jwt.
  #                    - Phù hợp môi trường không muốn duy trì IPFS daemon nội bộ.
  # 4. "hybrid"      : Chế độ kết hợp (khuyên dùng cho production/staging).
  #                    - Upload đồng thời/lần lượt lên cả Kubo node cục bộ và Pinata Cloud để dự phòng(redundancy).
  #                    - Đảm bảo dữ liệu vừa có thể truy xuất nhanh từ local node, vừa được pin lâu dài trên public IPFS network. 
  #                    - Có cơ chế tự động fallback an toàn nếu một trong hai bên gặp sự cố.
  ipfs.mode=local-only
  # Cấu hình Local Kubo IPFS Node (RPC API & Gateway)
  ipfs.local.api-url=http://localhost:5001/api/v0
  ipfs.local.gateway-url=http://127.0.0.1:8080/ipfs/
  # Cấu hình Pinata IPFS Cloud (Pinning Service API & Gateway)
  # ipfs.pinata.jwt: Điền JWT Bearer Token lấy từ Pinata Dashboard (bỏ trống nếu dùng mock hoặc local-only)      
  ipfs.pinata.jwt=${PINATA_JWT:}
  ipfs.pinata.api-url=https://api.pinata.cloud/pinning/pinFileToIPFS
  ipfs.pinata.gateway-url=https://gateway.pinata.cloud/ipfs/


# ===================== Internal service-to-service API =====================
# Phải trùng với internal.api.key của user-service; rỗng ở môi trường dev.
internal.api.key=${INTERNAL_API_KEY:}
