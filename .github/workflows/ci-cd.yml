name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  schedule:
    - cron: "0 19 * * *" # Chạy định kỳ 02:00 sáng giờ VN (Nightly E2E Staging)
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # 1. COMMIT LINT: Kiểm tra chuẩn Conventional Commits trên GitHub
  # =========================================================================
  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Validate Push commit
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

  # =========================================================================
  # 2. PATHS FILTER: Nhận diện service nào có thay đổi code
  # =========================================================================
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      user-service: ${{ steps.filter.outputs.user-service }}
      document-service: ${{ steps.filter.outputs.document-service }}
      recommendation-service: ${{ steps.filter.outputs.recommendation-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e-tests: ${{ steps.filter.outputs.e2e-tests }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            user-service:
              - 'services/user-service/**'
            document-service:
              - 'services/document-service/**'
            recommendation-service:
              - 'services/recommendation-service/**'
            api-gateway:
              - 'api-gateway/**'
            frontend:
              - 'frontend/**'
            e2e-tests:
              - 'e2e-tests/**'
            workflows:
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'
              - 'commitlint.config.js'

  # =========================================================================
  # 3. BACKEND UNIT TESTS: Chạy Unit Test cho các service thay đổi
  # =========================================================================
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      needs.changes.outputs.user-service == 'true' ||
      needs.changes.outputs.document-service == 'true' ||
      needs.changes.outputs.recommendation-service == 'true' ||
      needs.changes.outputs.api-gateway == 'true' ||
      needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        if: |
          needs.changes.outputs.user-service == 'true' ||
          needs.changes.outputs.document-service == 'true' ||
          needs.changes.outputs.api-gateway == 'true' ||
          needs.changes.outputs.workflows == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python 3.11
        if: needs.changes.outputs.recommendation-service == 'true' || needs.changes.outputs.workflows == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/recommendation-service/requirements.txt'

      - name: Unit Test User Service
        if: needs.changes.outputs.user-service == 'true' || needs.changes.outputs.workflows == 'true'
        working-directory: ./services/user-service
        run: mvn clean test

      - name: Unit Test Document Service
        if: needs.changes.outputs.document-service == 'true' || needs.changes.outputs.workflows == 'true'
        working-directory: ./services/document-service
        run: mvn clean test

      - name: Unit Test API Gateway
        if: needs.changes.outputs.api-gateway == 'true' || needs.changes.outputs.workflows == 'true'
        working-directory: ./api-gateway
        run: mvn clean test

      - name: Unit Test Recommendation Service
        if: needs.changes.outputs.recommendation-service == 'true' || needs.changes.outputs.workflows == 'true'
        working-directory: ./services/recommendation-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -d "tests/unit" ]; then
            pytest tests/unit/ --ignore=tests/unit/test_comprehensive_coverage.py --no-cov -v
          else
            pytest --no-cov -v
          fi

  # =========================================================================
  # 4. BACKEND INTEGRATION TESTS: Chạy IT với PostgreSQL Container thật
  # =========================================================================
  backend-it:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: [changes, backend-unit]
    if: |
      always() &&
      (needs.changes.outputs.user-service == 'true' ||
       needs.changes.outputs.document-service == 'true' ||
       needs.changes.outputs.recommendation-service == 'true' ||
       needs.changes.outputs.workflows == 'true') &&
      needs.backend-unit.result == 'success'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: user_service_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize PostgreSQL Multi-Databases
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d user_service_db -c "CREATE ROLE root WITH SUPERUSER LOGIN PASSWORD 'rootpassword';" || true
          PGPASSWORD=password psql -h localhost -U postgres -d user_service_db -c "CREATE DATABASE document_db;" || true
          PGPASSWORD=password psql -h localhost -U postgres -d user_service_db -c "CREATE DATABASE ai_service_db;" || true

      - name: Set up Java 21
        if: |
          needs.changes.outputs.user-service == 'true' ||
          needs.changes.outputs.document-service == 'true' ||
          needs.changes.outputs.workflows == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python 3.11
        if: needs.changes.outputs.recommendation-service == 'true' || needs.changes.outputs.workflows == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'services/recommendation-service/requirements.txt'

      # 1. User Service Integration Tests
      - name: Run User Service Integration Tests
        if: needs.changes.outputs.user-service == 'true' || needs.changes.outputs.workflows == 'true'
        working-directory: ./services/user-service
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/user_service_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: password
        run: mvn verify -DskipUnitTests=true -Dspring.profiles.active=test || mvn verify -Dspring.profiles.active=test

      # 2. Document Service Integration Tests (*IT.java)
      - name: Run Document Service Integration Tests
        if: needs.changes.outputs.document-service == 'true' || needs.changes.outputs.workflows == 'true'
        working-directory: ./services/document-service
        run: mvn test -Dtest="*IT" -Dsurefire.failIfNoSpecifiedTests=false -Dspring.profiles.active=test

      # 3. Recommendation Service Integration Tests
      - name: Run Recommendation Service Integration Tests
        if: needs.changes.outputs.recommendation-service == 'true' || needs.changes.outputs.workflows == 'true'
        working-directory: ./services/recommendation-service
        env:
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5432/ai_service_db
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          alembic upgrade head || true
          if [ -d "tests" ]; then
            pytest tests/ -v
          else
            pytest -v
          fi

  # =========================================================================
  # 5. FRONTEND: Lint, TypeScript Check, Unit Test & Production Build
  # =========================================================================
  frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Frontend (Oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Check TypeScript Types
        working-directory: ./frontend
        run: npx tsc -b

      - name: Run Frontend Unit Tests
        working-directory: ./frontend
        run: npm run test

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

  # =========================================================================
  # 6. SECURITY: Quét lộ Secret & Token bí mật
  # =========================================================================
  security:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
        continue-on-error: true

  # =========================================================================
  # 7. API TESTS: Chạy Newman Postman Collection nếu có
  # =========================================================================
  api-tests:
    name: API & Contract Tests
    runs-on: ubuntu-latest
    needs: [backend-it]
    if: always() && needs.backend-it.result != 'failure' && needs.backend-it.result != 'cancelled'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Newman API Tests
        run: |
          if [ -d "api-tests" ] && [ $(ls api-tests/*.json 2>/dev/null | wc -l) -gt 0 ]; then
            npm install -g newman
            newman run api-tests/*.json
          else
            echo "No Postman collection found in api-tests/, skipping."
          fi

  # =========================================================================
  # 8. CI QUALITY GATE: Cổng chốt chặn duy nhất cho GitHub Branch Protection
  # =========================================================================
  ci-gate:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    needs: [commit-lint, changes, backend-unit, backend-it, frontend, security, api-tests]
    if: always()
    steps:
      - name: Check All Jobs Status
        run: |
          echo "Commit-lint: ${{ needs.commit-lint.result }}"
          echo "Backend-unit: ${{ needs.backend-unit.result }}"
          echo "Backend-it: ${{ needs.backend-it.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Api-tests: ${{ needs.api-tests.result }}"

          for result in \
            "${{ needs.commit-lint.result }}" \
            "${{ needs.backend-unit.result }}" \
            "${{ needs.backend-it.result }}" \
            "${{ needs.frontend.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.api-tests.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "CI Gate FAILED: One or more critical jobs failed or were cancelled!"
              exit 1
            fi
          done

          echo "CI Gate PASSED: All jobs passed or were skipped appropriately."

  # =========================================================================
  # 9. CD: BUILD DOCKER IMAGES & PUSH TO DOCKER HUB & DEPLOY TO AWS EC2
  # =========================================================================
  deploy-ec2:
    name: Build, Push to Docker Hub & Deploy to EC2
    runs-on: ubuntu-latest
    needs: [ci-gate, changes]
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/dev' && (
        needs.changes.outputs.user-service == 'true' ||
        needs.changes.outputs.document-service == 'true' ||
        needs.changes.outputs.recommendation-service == 'true' ||
        needs.changes.outputs.workflows == 'true'
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push User Service
        if: needs.changes.outputs.user-service == 'true' || needs.changes.outputs.workflows == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./services/user-service
          file: ./services/user-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dedocu-user-service:latest

      - name: Build & Push Document Service
        if: needs.changes.outputs.document-service == 'true' || needs.changes.outputs.workflows == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./services/document-service
          file: ./services/document-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dedocu-document-service:latest

      - name: Build & Push Recommendation Service
        if: needs.changes.outputs.recommendation-service == 'true' || needs.changes.outputs.workflows == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./services/recommendation-service
          file: ./services/recommendation-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dedocu-recommendation-service:latest

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /home/ubuntu/decentralized-academic-network
            git checkout dev
            git pull origin dev
            cd infrastructure

            # Dọn dẹp image thừa/cũ để giải phóng ổ cứng và RAM
            docker image prune -f

            # Kéo tuần tự từng service thay đổi để chống nghẽn CPU t3.micro
            PULL_SERVICES=""
            if [ "${{ needs.changes.outputs.user-service }}" = "true" ] || [ "${{ needs.changes.outputs.workflows }}" = "true" ]; then
              docker compose pull user-service
              PULL_SERVICES="$PULL_SERVICES user-service"
            fi
            if [ "${{ needs.changes.outputs.document-service }}" = "true" ] || [ "${{ needs.changes.outputs.workflows }}" = "true" ]; then
              docker compose pull document-service
              PULL_SERVICES="$PULL_SERVICES document-service"
            fi
            if [ "${{ needs.changes.outputs.recommendation-service }}" = "true" ] || [ "${{ needs.changes.outputs.workflows }}" = "true" ]; then
              docker compose pull recommendation-service
              PULL_SERVICES="$PULL_SERVICES recommendation-service"
            fi

            # Khởi động lại các container mới cập nhật
            if [ -n "$PULL_SERVICES" ]; then
              docker compose up -d $PULL_SERVICES
            else
              docker compose up -d
            fi

  # =========================================================================
  # 10. E2E SELENIUM TESTS (JAVA & PYTHON): Tự động quét & chạy toàn bộ E2E
  #     của cả nhóm trên môi trường Test (Staging) sau khi deploy xong
  # =========================================================================
  e2e-staging:
    name: E2E Selenium Tests (Java & Python)
    runs-on: ubuntu-latest
    needs: [ci-gate, changes, deploy-ec2]
    timeout-minutes: 25
    if: |
      !cancelled() &&
      needs.ci-gate.result == 'success' &&
      (needs.deploy-ec2.result == 'success' || needs.deploy-ec2.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/dev')
      )
    env:
      E2E_BASE_URL: https://dedocu-dev.vercel.app
      E2E_API_URL: https://dedocu.duckdns.org/doc
      E2E_USER_API_URL: https://dedocu.duckdns.org/user
      E2E_HEADLESS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Staging Backend & Frontend to be healthy
        run: |
          echo "Checking Staging Frontend ($E2E_BASE_URL) & Backend ($E2E_API_URL)..."
          for i in $(seq 1 18); do
            FE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$E2E_BASE_URL" || echo "000")
            BE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$E2E_API_URL/api/v1/documents" || echo "000")
            echo "Attempt $i: FE=$FE_CODE, BE=$BE_CODE"
            if [ "$FE_CODE" = "200" ] && [ "$BE_CODE" = "200" ]; then
              echo "Staging environment is healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Staging healthcheck did not return 200 within timeout, proceeding anyway..."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'e2e-tests/python/requirements.txt'

      # 10a. Chạy TẤT CẢ các file Java Selenium (*Test.java) ngoại trừ các bài gắn @Tag("local-db")
      #      Bất kỳ file *Test.java nào thành viên mới thêm vào e2e-tests/ đều tự động được chạy!
      - name: Run Java Selenium E2E Suite (All Staging-Ready Tests)
        working-directory: ./e2e-tests
        run: |
          mvn test \
            -DexcludedGroups=local-db \
            -DbaseUrl="${{ env.E2E_BASE_URL }}" \
            -Dheadless=true

      # 10b. Tự động đăng nhập lấy JWT tươi & chạy TẤT CẢ kịch bản Python Selenium (scenarios/test_*.py)
      - name: Install Python Selenium dependencies
        working-directory: ./e2e-tests/python
        run: pip install -r requirements.txt

      - name: Fetch fresh Staging JWT for Python E2E
        id: auth
        run: |
          LOGIN_RES=$(curl -sS -X POST "$E2E_USER_API_URL/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"tan.tranminh@dedocu.vn","password":"Password@123"}' || echo "{}")
          TOKEN=$(echo "$LOGIN_RES" | python3 -c "import sys, json; d=json.load(sys.stdin); print((d.get('data') or {}).get('accessToken', ''))" 2>/dev/null || echo "")
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
            echo "Obtained fresh staging JWT token for Python E2E."
          else
            echo "::warning::Could not obtain staging JWT token; Python E2E will run without pre-injected token."
            echo "token=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Python Selenium E2E Suite (All Scenarios)
        working-directory: ./e2e-tests/python
        continue-on-error: true
        env:
          E2E_ACCESS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          pytest scenarios/ -v --html=report.html --self-contained-html

      - name: Upload E2E Test Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-selenium-reports
          path: |
            e2e-tests/target/surefire-reports/
            e2e-tests/python/report.html
            e2e-tests/python/screenshots/
          if-no-files-found: ignore
          retention-days: 14


